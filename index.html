<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #c3ec52 0%, #0ba29d 100%);
      font-family: Arial, sans-serif;
    }
    .login-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-container h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    .login-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      background: #0ba29d;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .main-app {
      display: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="login-container" id="loginContainer">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button onclick="login()">Login</button>
  </div>

  <div class="main-app" id="mainApp">
    <div class="container">
      <header>
        <h1>Expense Tracker</h1>
        <button onclick="logout()" style="float:right;">Logout</button>
      </header>
      <nav>
        <ul>
          <li><a href="#" onclick="showDashboard()">Dashboard</a></li>
          <li><a href="#" onclick="showTransactions()">Transactions</a></li>
          <li><a href="#" onclick="showAddTransaction()">Add Transaction</a></li>
          <li><a href="#" onclick="showCategories()">Categories</a></li>
        </ul>
      </nav>
      <main id="content"></main>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRJ_KxdDCQZGppVeH0tGiKTZfro_dMru0",
      authDomain: "expense-tracker-5b8ac.firebaseapp.com",
      projectId: "expense-tracker-5b8ac",
      storageBucket: "expense-tracker-5b8ac.appspot.com",
      messagingSenderId: "917290428768",
      appId: "1:917290428768:web:5d08b0baf1397e9d6c5605",
      measurementId: "G-TMC1HLKCQJ"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        fetchTransactions();
      } else {
        document.getElementById('loginContainer').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
      }
    });

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(error => alert(error.message));
    }

    function logout() {
      auth.signOut();
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
